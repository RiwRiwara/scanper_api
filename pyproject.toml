[tool.poetry]
name = "fastapi-poetry"
version = "0.1.0"
description = "FastAPI project scaffolded with Poetry"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
line-bot-sdk = "^3.5.0"
azure-ai-documentintelligence = "^1.0.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
openai = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"

[tool.poetry.scripts]
dev = "app.main:dev"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
